<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="page-container">

    <div class="result-card">

        {% set mensaje_lower = mensaje|lower %}

        {% if tipo == "success" or "aceptada" in mensaje_lower or "correctamente" in mensaje_lower %}
            <div class="result-icon success">✓</div>
        {% else %}
            <div class="result-icon error">✗</div>
        {% endif %}

        <h1>Resultado</h1>

        <p>{{ mensaje }}</p>

        <div class="result-actions">
            <a href="{{ url_for('problems') }}" class="primary-btn">Volver a problemas</a>
            <a href="{{ url_for('home') }}" class="secondary-btn">Inicio</a>
        </div>
    </div>

</div>

</body>
</html>
